<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>WCA Admin</title>
<style>:root{--ink:#0f2a43;--teal:#0e7c86;--bg:#f2f6f9;--line:#dbe5ec;--bad:#b3261e;--ok:#17803d}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--ink);color:#fff;padding:10px 14px}header b{display:block;margin-bottom:6px}nav{display:flex;flex-wrap:wrap;gap:4px}nav button{background:#1c4468;color:#fff;border:0;border-radius:8px;padding:9px 12px;font:inherit;font-size:14px;min-height:40px}nav button.on{background:var(--teal)}
main{max-width:1000px;margin:0 auto;padding:14px}.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.card b.n{font-size:26px;color:var(--teal)}
.btn{min-height:42px;padding:9px 14px;border:0;border-radius:10px;background:var(--teal);color:#fff;font:600 14px system-ui;cursor:pointer;margin:2px}.bad{background:var(--bad)}.alt{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
input,select,textarea{width:100%;min-height:44px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:4px 0 8px;background:#fff}textarea{min-height:110px}.chk{width:auto;min-height:0}
.tblw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left}
.msg{padding:10px;border-radius:10px;margin:8px 0;background:#fde8e6;color:var(--bad)}.ok{background:#e4f5ea;color:var(--ok)}.pill{background:#e3f3f4;color:var(--teal);padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}img.s{max-width:100%;border-radius:8px}</style></head><body>
<header><b>⚕ White Coat Academy — Admin</b><nav id="nav" hidden></nav></header><main id="app"><div id="boot" style="padding:40px 16px;text-align:center;color:#5b6f82">Loading…</div></main>
<script>setTimeout(function(){var b=document.getElementById("boot");if(b)b.innerHTML="Still loading. Check your internet connection and refresh. If this stays, the page could not start (Firebase settings or domain not set)."},12000)</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,collection,query,where,limit,writeBatch,runTransaction,Timestamp,getCountFromServer,arrayUnion}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
/* ===== SAME FIREBASE CONFIG AS index.html ===== */
const CFG={apiKey:"AIzaSyB7ly6kO6N5Eqc2d6RL2r9FnKR23U2xhfo",authDomain:"whitecoat-a17e4.firebaseapp.com",projectId:"whitecoat-a17e4",appId:"1:876316492229:web:48c775a827cf68e8fc8bac"};
/* ============================================== */
const auth=getAuth(initializeApp(CFG)),db=getFirestore(auth.app),app=document.getElementById("app"),NAV=document.getElementById("nav");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SUBJ=["Biology","Chemistry","Physics","English","Logical Reasoning"],opt=a=>a.map(x=>`<option>${x}</option>`).join(""),$=s=>document.querySelector(s);
const all=async(c,...w)=>(await getDocs(query(collection(db,c),...w))).docs.map(d=>({id:d.id,...d.data()}));
const cnt=async(c,...w)=>(await getCountFromServer(query(collection(db,c),...w))).data().count;
const audit=(a,t)=>addDoc(collection(db,"auditLog"),{by:auth.currentUser.uid,action:a,target:t,at:Timestamp.now()});
const msg=(t,ok)=>{const m=$("#m");if(m)m.innerHTML=`<div class="msg ${ok?"ok":""}">${esc(t)}</div>`};
const TABS={dash:"Dashboard",pay:"Payments",content:"Content",qs:"Questions",tests:"Tests",stu:"Students",sup:"Support",set:"Settings"};
function login(m=""){NAV.hidden=true;app.innerHTML=`<div class="card" style="max-width:380px;margin:30px auto"><h3>Admin login</h3><label>Email<input id="e" type="email"></label><label>Password<input id="p" type="password"></label><button class="btn" id="go">Login</button>${m}</div>`;
$("#go").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("#e").value,$("#p").value)}catch{login('<div class="msg">Login failed.</div>')}}}
async function go(t){NAV.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));app.innerHTML="<p>Loading…</p>";try{await T[t]()}catch(e){app.innerHTML=`<div class="msg">Error: ${esc(e.code||e.message)}</div>`}}
const T={
async dash(){const[u,p,v,pr,tk]=await Promise.all([cnt("users"),cnt("payments",where("status","==","pending")),cnt("payments",where("status","==","verified")),getDoc(doc(db,"settings","promo")),cnt("tickets",where("status","==","new"))]);const d=pr.data()||{used:0,limit:100};
const[it,qn,pu]=await Promise.all([cnt("items"),cnt("questions"),cnt("items",where("status","==","draft"))]);
const rec=(await all("users",limit(5))).map(x=>esc(x.name)).join(", ");app.innerHTML=`<div class="grid">${[[u,"Registered students"],[v,"Paid (verified)"],[p,"Pending payments"],[tk,"New tickets"],[d.used+"/"+d.limit,"Promo places used"],[it,"Content items"],[qn,"Questions"],[pu,"Draft items"]].map(([a,b])=>`<div class="card"><b class="n">${a}</b><br>${b}</div>`).join("")}</div><div class="card">Recent registrations: ${rec||"none"}</div>`},
async pay(){const ps=await all("payments",where("status","==","pending"));app.innerHTML=`<p>Check the money in your JazzCash/Easypaisa account first. A screenshot alone is never proof.</p>${ps.map(x=>`<div class="card"><b>${esc(x.name)}</b> · ${esc(x.method)} · PKR ${esc(x.amount)}<br>Sender: ${esc(x.senderName)} ${esc(x.senderPhone)}<br>Txn: <b>${esc(x.txnRef)}</b> · ${esc(x.paidAt)}<br><img class="s" src="${esc(x.screenshot)}"><br><button class="btn" data-a="ok" data-id="${x.id}">Approve</button><button class="btn bad" data-a="no" data-id="${x.id}">Reject</button></div>`).join("")||"<p>No pending payments.</p>"}<div id="m"></div>`;
document.querySelectorAll("[data-id]").forEach(b=>b.onclick=async()=>{if(!confirm("Confirm "+b.dataset.a+"?"))return;try{if(b.dataset.a==="no"){await updateDoc(doc(db,"payments",b.dataset.id),{status:"rejected",reviewedBy:auth.currentUser.uid});await audit("payment_reject",b.dataset.id)}else await approve(b.dataset.id);go("pay")}catch(e){msg("Failed: "+(e.message||e.code))}})},
async content(){const L=await all("items");const f=window.ed||{};app.innerHTML=`<div class="card"><b>${f.id?"Edit":"New"} Read/Revise item</b><label>Section<select id="sc">${opt(["read","revise"])}</select></label><label>Subject<select id="sj">${opt(SUBJ)}</select></label><label>Chapter<input id="ch" value="${esc(f.chapter)}"></label><label>Title / topic<input id="ti" value="${esc(f.title)}"></label><label>Order<input id="or" type="number" value="${f.order||0}"></label><label>Content (plain text)<textarea id="bd">${esc(f.body)}</textarea></label>
<label><input class="chk" id="pv" type="checkbox" ${f.preview?"checked":""}> Free preview item</label><label>Status<select id="st">${opt(["draft","review","published"])}</select></label><button class="btn" id="sv">Save</button><div id="m"></div></div>
<div class="tblw"><table><tr><th>Section</th><th>Subject</th><th>Chapter</th><th>Title</th><th>Status</th><th></th></tr>${L.map(x=>`<tr><td>${x.section}</td><td>${esc(x.subject)}</td><td>${esc(x.chapter)}</td><td>${esc(x.title)}</td><td><span class="pill">${x.status}</span></td><td><button class="btn alt" data-e="${x.id}">Edit</button><button class="btn" data-p="${x.id}">${x.status==="published"?"Unpublish":"Publish"}</button><button class="btn bad" data-d="${x.id}">Del</button></td></tr>`).join("")}</table></div>`;
if(f.id){$("#sc").value=f.section;$("#sj").value=f.subject;$("#st").value=f.status}
$("#sv").onclick=async()=>{const d={section:$("#sc").value,subject:$("#sj").value,chapter:$("#ch").value.trim(),title:$("#ti").value.trim(),order:+$("#or").value||0,body:$("#bd").value,preview:$("#pv").checked,status:$("#st").value};if(!d.chapter||!d.title||!d.body)return msg("Chapter, title and content are required.");
if(f.id){await setDoc(doc(db,"items",f.id,"versions","v"+(f.version||1)),{...f,savedAt:Timestamp.now()});await updateDoc(doc(db,"items",f.id),{...d,version:(f.version||1)+1})}else await addDoc(collection(db,"items"),{...d,version:1,createdAt:Timestamp.now()});window.ed=null;await audit("content_save",d.title);go("content")};
document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{window.ed=L.find(x=>x.id===b.dataset.e);go("content")});
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{const x=L.find(y=>y.id===b.dataset.p);await updateDoc(doc(db,"items",x.id),{status:x.status==="published"?"draft":"published"});go("content")});
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Delete permanently?")){await deleteDoc(doc(db,"items",b.dataset.d));go("content")}})},
async qs(){const L=await all("questions");app.innerHTML=`<div class="card"><b>Add one MCQ</b><label>Subject<select id="sj">${opt(SUBJ)}</select></label><label>Chapter<input id="ch"></label><label>Topic<input id="tp"></label><label>Question<textarea id="qq"></textarea></label>${[0,1,2,3].map(i=>`<input class="o" placeholder="Option ${"ABCD"[i]}">`).join("")}<label>Correct option<select id="co">${opt(["A","B","C","D"])}</select></label><label>Explanation<textarea id="ex"></textarea></label><label>Difficulty<select id="df">${opt(["easy","medium","hard"])}</select></label><label><input class="chk" id="pv" type="checkbox"> Free preview</label><button class="btn" id="sv">Save as draft</button></div>
<div class="card"><b>Bulk import (JSON)</b><p>Array of {subject, chapter, topic, question, options:[..], correct:0-based number, explanation, difficulty}. Imported as drafts for review.</p><textarea id="js" placeholder='[{"subject":"Biology","chapter":"Cell","question":"...","options":["a","b","c","d"],"correct":1,"explanation":"..."}]'></textarea><button class="btn" id="im">Validate and import</button><div id="m"></div></div>
<div class="card"><b>Import history</b><div id="ih"></div></div><div class="tblw"><table><tr><th>Subject</th><th>Chapter</th><th>Question</th><th>Status</th><th></th></tr>${L.slice(0,150).map(x=>`<tr><td>${esc(x.subject)}</td><td>${esc(x.chapter)}</td><td>${esc((x.question||"").slice(0,60))}</td><td><span class="pill">${x.status}</span></td><td><button class="btn" data-p="${x.id}">${x.status==="published"?"Unpublish":"Publish"}</button><button class="btn bad" data-d="${x.id}">Del</button></td></tr>`).join("")}</table></div>`;
const bad=q=>!q.subject||!SUBJ.includes(q.subject)||!q.chapter||!q.question||!Array.isArray(q.options)||q.options.length<2||q.options.some(o=>!String(o).trim())||!Number.isInteger(q.correct)||q.correct<0||q.correct>=q.options.length;
$("#sv").onclick=async()=>{const q={subject:$("#sj").value,chapter:$("#ch").value.trim(),topic:$("#tp").value.trim(),question:$("#qq").value.trim(),options:[...document.querySelectorAll(".o")].map(x=>x.value.trim()),correct:$("#co").selectedIndex,explanation:$("#ex").value,difficulty:$("#df").value,preview:$("#pv").checked};
if(bad(q))return msg("Fill subject, chapter, question and all four options.");await addDoc(collection(db,"questions"),{...q,status:"draft",version:1,createdAt:Timestamp.now()});go("qs")};
$("#im").onclick=async()=>{let a;try{a=JSON.parse($("#js").value)}catch{return msg("Not valid JSON.")}if(!Array.isArray(a))return msg("Must be an array.");const have=new Set(L.map(x=>x.question)),errs=[],ok=[];
a.forEach((q,i)=>{if(bad(q))errs.push("#"+(i+1)+" invalid fields or answer key");else if(have.has(q.question)||ok.some(z=>z.question===q.question))errs.push("#"+(i+1)+" duplicate question");else ok.push(q)});
if(errs.length&&!confirm(errs.length+" problems:\n"+errs.slice(0,8).join("\n")+"\nImport the "+ok.length+" valid ones as drafts?"))return;
const ids=[];for(let i=0;i<ok.length;i+=400){const b=writeBatch(db);ok.slice(i,i+400).forEach(q=>{const r=doc(collection(db,"questions"));ids.push(r.id);b.set(r,{subject:q.subject,chapter:q.chapter,topic:q.topic||"",question:q.question,options:q.options.map(String),correct:q.correct,explanation:q.explanation||"",difficulty:q.difficulty||"medium",preview:false,status:"draft",version:1,createdAt:Timestamp.now()})});await b.commit()}
await addDoc(collection(db,"imports"),{by:auth.currentUser.uid,count:ids.length,skipped:errs.length,ids,at:Timestamp.now(),rolledBack:false});await audit("import",ids.length+" questions");go("qs")};
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{const x=L.find(y=>y.id===b.dataset.p);await updateDoc(doc(db,"questions",x.id),{status:x.status==="published"?"draft":"published"});go("qs")});
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Delete permanently?")){await deleteDoc(doc(db,"questions",b.dataset.d));go("qs")}});
const H=await all("imports",limit(10));$("#ih").innerHTML=H.map(h=>`<p>${h.at.toDate().toLocaleString()} · ${h.count} imported, ${h.skipped} skipped ${h.rolledBack?"(rolled back)":`<button class="btn alt" data-rb="${h.id}">Roll back drafts</button>`}</p>`).join("")||"None yet.";
document.querySelectorAll("[data-rb]").forEach(b=>b.onclick=async()=>{const h=H.find(x=>x.id===b.dataset.rb);if(!confirm("Delete this import's questions that are still drafts?"))return;for(const id of h.ids){const s=await getDoc(doc(db,"questions",id));if(s.exists()&&s.data().status==="draft")await deleteDoc(doc(db,"questions",id))}await updateDoc(doc(db,"imports",h.id),{rolledBack:true});go("qs")})},
async tests(){const L=await all("tests");app.innerHTML=`<div class="card"><b>Create test (copies published questions into the test)</b><label>Title<input id="ti"></label><label>Type<select id="ty">${opt(["chapter","quarter","mock","flp"])}</select></label><label>Quarter (1-12, quarterly only)<input id="qr" type="number" min="1" max="12"></label><label>Subject (blank = all)<select id="sj"><option value="">All</option>${opt(SUBJ)}</select></label><label>Chapter (blank = all)<input id="ch"></label><label>Max questions<input id="mx" type="number" value="30"></label><label>Duration (minutes)<input id="du" type="number" value="30"></label><label>Negative marks per wrong<input id="ng" type="number" step="0.05" value="0"></label><label><input class="chk" id="rn" type="checkbox"> Shuffle questions</label><label><input class="chk" id="pv" type="checkbox"> Free preview test</label><label>Status<select id="st">${opt(["draft","published"])}</select></label><button class="btn" id="sv">Create</button><div id="m"></div></div>
${L.map(t=>`<div class="card"><b>${esc(t.title)}</b> <span class="pill">${t.type}${t.quarter?" Q"+t.quarter:""}</span> <span class="pill">${t.status}</span> · ${t.questions.length} q<br><button class="btn" data-p="${t.id}">${t.status==="published"?"Unpublish":"Publish"}</button><button class="btn bad" data-d="${t.id}">Delete</button></div>`).join("")}`;
$("#sv").onclick=async()=>{let q=(await all("questions",where("status","==","published"))).filter(x=>(!$("#sj").value||x.subject===$("#sj").value)&&(!$("#ch").value||x.chapter===$("#ch").value));if($("#rn").checked)q.sort(()=>Math.random()-.5);q=q.slice(0,+$("#mx").value||30);
if(!$("#ti").value||!q.length)return msg("Needs a title and at least one published matching question.");await addDoc(collection(db,"tests"),{title:$("#ti").value,type:$("#ty").value,quarter:+$("#qr").value||null,duration:+$("#du").value||30,negative:+$("#ng").value||0,preview:$("#pv").checked,status:$("#st").value,questions:q.map(x=>({question:x.question,options:x.options,correct:x.correct,explanation:x.explanation||"",subject:x.subject,qid:x.id,version:x.version||1})),createdAt:Timestamp.now()});go("tests")};
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{const x=L.find(y=>y.id===b.dataset.p);await updateDoc(doc(db,"tests",x.id),{status:x.status==="published"?"draft":"published"});go("tests")});
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Delete test?")){await deleteDoc(doc(db,"tests",b.dataset.d));go("tests")}})},
async stu(){const U=await all("users",limit(200));app.innerHTML=`<input id="f" placeholder="Search name, email or ID"><div class="tblw"><table id="tb"></table></div><div id="m"></div>`;
const draw=()=>{const f=$("#f").value.toLowerCase();$("#tb").innerHTML=`<tr><th>Name</th><th>ID</th><th>Email</th><th>Status</th><th>Access</th><th>Expires</th><th>Actions</th></tr>`+U.filter(u=>(u.name+u.email+u.studentId).toLowerCase().includes(f)).map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.studentId)}</td><td>${esc(u.email)}</td><td>${u.status}</td><td>${esc(u.access?.type||"-")}</td><td>${u.access?.expiresAt?u.access.expiresAt.toDate().toLocaleDateString():"-"}</td><td><button class="btn alt" data-x="sus" data-id="${u.id}">${u.status==="active"?"Suspend":"Restore"}</button><button class="btn alt" data-x="ext" data-id="${u.id}">+30d</button><button class="btn alt" data-x="comp" data-id="${u.id}">Complimentary 1y</button></td></tr>`).join("");
document.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{const u=U.find(y=>y.id===b.dataset.id),r=doc(db,"users",u.id),now=Date.now();if(!confirm(b.dataset.x+" for "+u.name+"?"))return;
if(b.dataset.x==="sus")await updateDoc(r,{status:u.status==="active"?"suspended":"active"});
if(b.dataset.x==="ext"){const base=Math.max(now,u.access?.expiresAt?.toMillis?.()||0);await updateDoc(r,{access:{type:u.access?.type==="preview"||!u.access?.type?"paid":u.access.type,activatedAt:u.access?.activatedAt||Timestamp.now(),expiresAt:Timestamp.fromMillis(base+30*864e5)}})}
if(b.dataset.x==="comp")await updateDoc(r,{access:{type:"complimentary",activatedAt:Timestamp.now(),expiresAt:Timestamp.fromMillis(now+365*864e5)}});await audit("student_"+b.dataset.x,u.id);go("stu")})};draw();$("#f").oninput=draw},
async sup(){const L=await all("tickets");app.innerHTML=L.map(t=>`<div class="card"><b>#${t.id.slice(0,6).toUpperCase()} ${esc(t.subject)}</b> <span class="pill">${t.status}</span><br>${esc(t.name)} · ${esc(t.category)}${t.messages.map(x=>`<p><b>${x.from}:</b> ${esc(x.text)}</p>`).join("")}<input data-r="${t.id}" placeholder="Reply"><button class="btn" data-s="${t.id}" data-st="waiting">Reply (waiting for student)</button><button class="btn alt" data-s="${t.id}" data-st="resolved">Resolve</button><button class="btn alt" data-s="${t.id}" data-st="closed">Close</button></div>`).join("")||"<p>No tickets.</p>";
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=async()=>{const v=document.querySelector(`[data-r="${b.dataset.s}"]`).value,d={status:b.dataset.st};if(v)d.messages=arrayUnion({from:"admin",text:v.slice(0,2000),at:new Date().toISOString()});await updateDoc(doc(db,"tickets",b.dataset.s),d);go("sup")})},
async set(){const p=(await getDoc(doc(db,"settings","promo"))).data()||{enabled:true,limit:100,used:0,standardPrice:5000,promoPrice:3000},g=(await getDoc(doc(db,"settings","general"))).data()||{paidDays:365,previewHours:48,paymentInstructions:"",contact:"",refundPolicy:""};
app.innerHTML=`<div class="card"><b>Pricing & promotion</b><label>Standard price<input id="sp" type="number" value="${p.standardPrice}"></label><label>Promo price<input id="pp" type="number" value="${p.promoPrice}"></label><label>Promo limit<input id="pl" type="number" value="${p.limit}"></label><p>Places used (managed automatically): <b>${p.used}</b></p><label><input class="chk" id="pe" type="checkbox" ${p.enabled?"checked":""}> Promotion enabled</label></div>
<div class="card"><b>General</b><label>Paid access days<input id="pd" type="number" value="${g.paidDays||365}"></label><label>Payment instructions (JazzCash/Easypaisa account details)<textarea id="pi">${esc(g.paymentInstructions)}</textarea></label><label>Contact details<input id="ct" value="${esc(g.contact)}"></label><label>Refund policy text<textarea id="rf">${esc(g.refundPolicy)}</textarea></label><button class="btn" id="sv">Save settings</button><div id="m"></div></div>
<div class="card"><b>Announcement</b><input id="at" placeholder="Title"><textarea id="ax" placeholder="Text"></textarea><button class="btn" id="an">Post</button></div>`;
$("#sv").onclick=async()=>{await setDoc(doc(db,"settings","promo"),{enabled:$("#pe").checked,limit:+$("#pl").value,used:p.used||0,standardPrice:+$("#sp").value,promoPrice:+$("#pp").value});await setDoc(doc(db,"settings","general"),{paidDays:+$("#pd").value||365,previewHours:48,paymentInstructions:$("#pi").value,contact:$("#ct").value,refundPolicy:$("#rf").value});await audit("settings_save","");msg("Saved.",1)};
$("#an").onclick=async()=>{if($("#at").value)await addDoc(collection(db,"announcements"),{title:$("#at").value,text:$("#ax").value,at:Timestamp.now()});msg("Posted.",1)}}};
async function approve(id){await runTransaction(db,async t=>{const pr=doc(db,"payments",id),p=await t.get(pr);if(!p.exists()||p.data().status!=="pending")throw new Error("Already processed");
const pm=doc(db,"settings","promo"),ps=await t.get(pm),gs=await t.get(doc(db,"settings","general")),d=ps.data()||{enabled:false,used:0,limit:0},promo=!!d.enabled&&d.used<d.limit,days=(gs.data()||{}).paidDays||365,now=Date.now();
t.update(pr,{status:"verified",promoApplied:promo,verifiedAt:Timestamp.now(),reviewedBy:auth.currentUser.uid});
t.update(doc(db,"users",p.data().uid),{access:{type:"paid",activatedAt:Timestamp.fromMillis(now),expiresAt:Timestamp.fromMillis(now+days*864e5)}});
